name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` roda `tsc -b` antes do Vite, então checa os tipos dos
      # três projetos (app, testes e e2e) além de gerar o bundle.
      - name: Tipos e build
        run: npm run build

      - name: Testes de domínio
        run: npm test

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npm run test:e2e

      - name: Guardar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
